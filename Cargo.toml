[package]
name = "glab-pull-all"
version = "0.3.0"
edition = "2021"
description = "A powerful command-line tool for efficiently syncing all repositories from a GitLab group or user account with parallel processing, real-time status updates, and advanced features"
readme = "README.md"
license = "Unlicense"
keywords = ["gitlab", "glab", "git", "sync", "cli"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/link-foundation/glab-pull-all"
documentation = "https://github.com/link-foundation/glab-pull-all"
rust-version = "1.70"

[lib]
name = "glab_pull_all"
path = "src/lib.rs"

[[bin]]
name = "glab-pull-all"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util", "io-std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
crossterm = "0.28"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
